<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consulta de Productos</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#17202a}
.wrap{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 6px 25px #00000012;margin-bottom:14px}
h1{font-size:25px;margin:0 0 5px}h2{font-size:19px;margin:6px 0 14px}.sub{color:#68737d;margin:0 0 18px;font-size:14px}
button{border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.scan{background:#17202a;color:#fff}.secondary{background:#e9edf1;color:#17202a;margin-top:10px}
input{width:100%;padding:14px;border:1px solid #d5dbe0;border-radius:13px;font-size:16px;outline:none;margin-bottom:9px}
input:focus{border-color:#17202a}.or{text-align:center;color:#7b858e;font-size:13px;margin:13px 0}
#reader{display:none;margin-top:14px;overflow:hidden;border-radius:15px;background:#111}video{width:100%;display:block;min-height:220px;object-fit:cover}
.msg{font-size:14px;margin-top:10px;color:#68737d}.err{color:#b42318}
.result{display:none;text-align:center}.productName{font-size:20px;font-weight:800;margin:5px 0 12px}.price{font-size:42px;font-weight:900;margin:0 0 14px}
.meta{font-size:12px;color:#7b858e}.results{margin-top:8px}.item{padding:13px 4px;border-bottom:1px solid #edf0f2;cursor:pointer}.item b{display:block}.item span{font-size:13px;color:#68737d}
.admin{display:none}.row{display:flex;gap:9px}.row input{flex:1;margin:0}.row button{width:auto}.save{background:#17202a;color:#fff}
.small{font-size:12px;color:#68737d;line-height:1.4;margin-top:10px}.danger{background:#fff0f0;color:#a21d1d}
.notice{background:#f7f8fa;border-radius:12px;padding:11px;font-size:12px;color:#68737d;margin-top:10px}
</style></head><body><div class="wrap">
<div class="card">
<h1>📦 Consulta de productos</h1><p class="sub">Escanea un código o busca por nombre o código de barras</p>
<button class="scan" id="scanBtn">📷 Escanear producto</button>
<div id="reader"><video id="video" playsinline muted></video></div><div id="msg" class="msg"></div>
<div class="or">O BUSCA MANUALMENTE</div>
<input id="search" placeholder="🔎 Nombre o número de código de barras..." autocomplete="off">
<div id="results" class="results"></div>
<button class="secondary" id="addBtn">➕ Agregar producto</button>
</div>

<div class="card result" id="result">
<div class="meta">PRODUCTO</div><div class="productName" id="productName"></div><div class="price" id="price"></div>
<div class="meta" id="code"></div><button class="secondary" id="editBtn">⚙️ Modificar precio</button>
</div>

<div class="card admin" id="admin">
<div class="meta">ADMINISTRAR PRECIO</div><h2 id="adminName"></h2>
<div class="row"><input id="newPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Nuevo precio"><button class="save" id="saveBtn">Guardar</button></div>
</div>

<div class="card admin" id="addPanel">
<div class="meta">NUEVO PRODUCTO</div><h2>➕ Agregar producto</h2>
<input id="addName" placeholder="Nombre del producto">
<input id="addBarcode" placeholder="Código de barras (opcional)" inputmode="numeric">
<input id="addPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Precio para el cliente">
<button class="save" id="createBtn">Guardar producto</button>
<div class="notice">El producto agregado queda guardado en este navegador y aparecerá en las búsquedas y en futuros escaneos de este dispositivo.</div>
</div>
</div>

 current=p;document.getElementById("result").style.display="block";document.getElementById("productName").textContent=p.name;
 document.getElementById("price").textContent=money(effectivePrice(p));document.getElementById("code").textContent=p.barcode?"Código: "+p.barcode:"Código: —";
 document.getElementById("admin").style.display="none";document.getElementById("addPanel").style.display="none";document.getElementById("results").innerHTML="";document.getElementById("search").value="";
}
function searchProducts(q){
 const box=document.getElementById("results");box.innerHTML="";q=q.trim().toLowerCase();if(!q)return;
 const found=PRODUCTS.filter(p=>p.name.toLowerCase().includes(q)||String(p.barcode||"").toLowerCase().includes(q)).slice(0,15);
 if(!found.length){box.innerHTML='<div class="msg">No encontré productos con ese nombre o código.</div>';return}
 for(const p of found){const d=document.createElement("div");d.className="item";d.innerHTML="<b>"+esc(p.name)+"</b><span>"+(p.barcode?"Código: "+esc(p.barcode)+" · ":"")+money(effectivePrice(p))+"</span>";d.onclick=()=>showProduct(p);box.appendChild(d)}
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function stopScan(){scanning=false;if(reader&&reader.reset)try{reader.reset()}catch(e){}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById("reader").style.display="none";document.getElementById("scanBtn").textContent="📷 Escanear producto"}
async function scan(){
 if(scanning){stopScan();return}const msg=document.getElementById("msg");msg.className="msg";msg.textContent="Solicitando cámara…";
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});const video=document.getElementById("video");video.srcObject=stream;await video.play();
  document.getElementById("reader").style.display="block";scanning=true;document.getElementById("scanBtn").textContent="⏹ Detener escáner";msg.textContent="Apunta al código de barras…";
  if("BarcodeDetector" in window){
   const formats=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","codabar"];let detector;try{detector=new BarcodeDetector({formats})}catch(e){detector=new BarcodeDetector()}
   const loop=async()=>{if(!scanning)return;try{const codes=await detector.detect(video);if(codes.length){const raw=codes[0].rawValue.trim(),p=byBarcode.get(raw);if(p){showProduct(p);msg.textContent="Producto encontrado";stopScan();return}msg.textContent="Código "+raw+" no está en la base de datos.";}}catch(e){}requestAnimationFrame(loop)};loop();
  }else{
   if(!window.ZXingBrowser)throw new Error("No se pudo cargar el lector alternativo.");reader=new ZXingBrowser.BrowserMultiFormatReader();
   reader.decodeFromVideoElement(video,(result,error)=>{if(!scanning)return;if(result){const raw=result.getText().trim(),p=byBarcode.get(raw);if(p){showProduct(p);stopScan()}else msg.textContent="Código "+raw+" no está en la base de datos."}});
  }
 }catch(e){stopScan();msg.className="msg err";msg.textContent=e.name==="NotAllowedError"?"Permiso de cámara denegado. Activa la cámara para este sitio.":"No se pudo abrir la cámara: "+e.message}
}
document.getElementById("scanBtn").onclick=scan;document.getElementById("search").oninput=e=>searchProducts(e.target.value);
document.getElementById("editBtn").onclick=()=>{if(!current)return;document.getElementById("admin").style.display="block";document.getElementById("adminName").textContent=current.name;document.getElementById("newPrice").value=effectivePrice(current);document.getElementById("newPrice").focus()};
document.getElementById("saveBtn").onclick=()=>{if(!current)return;const v=Number(document.getElementById("newPrice").value);if(!Number.isFinite(v)||v<0){alert("Escribe un precio válido.");return}localStorage.setItem("price_"+current.code,v);document.getElementById("price").textContent=money(v);document.getElementById("admin").style.display="none";alert("Precio actualizado.")};
document.getElementById("addBtn").onclick=()=>{document.getElementById("addPanel").style.display="block";document.getElementById("admin").style.display="none";document.getElementById("addName").focus()};
document.getElementById("createBtn").onclick=()=>{
 const name=document.getElementById("addName").value.trim(),barcode=document.getElementById("addBarcode").value.trim(),price=Number(document.getElementById("addPrice").value);
 if(!name){alert("Escribe el nombre del producto.");return}if(!Number.isFinite(price)||price<0){alert("Escribe un precio válido.");return}
 if(barcode&&byBarcode.has(barcode)){alert("Ese código de barras ya existe.");return}
 const extra=JSON.parse(localStorage.getItem("extra_products")||"[]"),p={code:"LOCAL_"+Date.now(),barcode,name,price};extra.push(p);localStorage.setItem("extra_products",JSON.stringify(extra));PRODUCTS.push(p);rebuildMap();
 document.getElementById("addName").value="";document.getElementById("addBarcode").value="";document.getElementById("addPrice").value="";
 document.getElementById("addPanel").style.display="none";showProduct(p);alert("Producto agregado correctamente.");
};
loadProducts().then(()=>document.getElementById("msg").textContent=PRODUCTS.length+" productos disponibles.").catch(()=>document.getElementById("msg").textContent="Error cargando productos.");
</script><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
